name: Publish npm package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify tagged source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node scripts/check-release-tag.js "$RELEASE_TAG"
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run check:package -- "$RUNNER_TEMP/npm-release"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release/*.tgz
          if-no-files-found: error
          overwrite: true

  publish:
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: npm-registry-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release
      - run: npm run publish:release -- "$RUNNER_TEMP"/npm-release/*.tgz
