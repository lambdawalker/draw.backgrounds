name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in package.json to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-npm

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node -e 'if (require("./package.json").version !== process.env.RELEASE_VERSION) throw new Error("Requested version does not match package.json")'
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run check:package

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm publish
